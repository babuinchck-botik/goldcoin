<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Счета GoldCoin</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
    color: #eef1f6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    margin: 0;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 24px;
    height: fit-content;
  }
  h1 { font-size: 22px; margin: 0 0 6px; text-align: center; }
  h2 { font-size: 17px; margin: 18px 0 10px; }
  .sub { text-align: center; color: #9fb0c9; font-size: 13px; margin: 0 0 18px; }
  .btn {
    display: block; width: 100%;
    padding: 14px; margin: 10px 0;
    font-size: 16px; font-weight: 600;
    border: none; border-radius: 12px;
    cursor: pointer;
    background: #4f7cff; color: #fff;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn.green { background: #2fae66; }
  .btn.red { background: #d94e4e; }
  .btn.orange { background: #f39c12; }
  .btn.small { padding: 8px 12px; font-size: 13px; width: auto; margin: 0; }
  input, select {
    width: 100%;
    padding: 12px; margin: 6px 0;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    outline: none;
  }
  input:focus, select:focus { border-color: #4f7cff; }
  select option { background: #16213e; color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .row input, .row select { flex: 1; margin: 0; }
  .msg { font-size: 13px; margin: 8px 0; min-height: 16px; }
  .err { color: #ff7b7b; }
  .ok { color: #6ee7a0; }
  .acct, .noti-item {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 12px; margin: 10px 0;
  }
  .acct .name { font-weight: 700; font-size: 16px; }
  .acct .bal { color: #ffd166; margin: 4px 0; }
  .pw, .salary-info { color: #9fb0c9; font-size: 13px; }
  .balance-big {
    font-size: 34px; font-weight: 800; color: #ffd166;
    text-align: center; margin: 14px 0;
  }
  .back {
    background: none; border: none; color: #9fb0c9;
    cursor: pointer; font-size: 14px; padding: 6px 0; margin-bottom: 8px;
  }
  .hidden { display: none; }
  .badge-blocked {
    display: inline-block; padding: 2px 6px; font-size: 11px;
    background: #d94e4e; color: #fff; border-radius: 6px; font-weight: bold;
  }
</style>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://gstatic.com";

  const firebaseConfig = {
    apiKey: "AIzaSyDgae6MDMQ1FM4Anlg7R7qPGX3Kc_S-DagPQ",
    authDomain: "://firebaseapp.com",
    projectId: "goldcoin-accounts",
    storageBucket: "goldcoin-accounts.firebasestorage.app",
    messagingSenderId: "587303464356",
    appId: "1:587303464356:web:72adddaef46fde263ca531"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const STORE_KEY = 'goldcoin_accounts_v2';

  onSnapshot(doc(db, "database", "global_state"), (docSnap) => {
    if (docSnap.exists()) {
      const cloudData = docSnap.data().accounts || [];
      const cloudNotis = docSnap.data().notifications || [];
      localStorage.setItem(STORE_KEY, JSON.stringify(cloudData));
      localStorage.setItem(STORE_KEY + '_notis', JSON.stringify(cloudNotis));
      
      if (typeof window.updateCurrentScreen === 'function') window.updateCurrentScreen();
      if (typeof window.renderAdmin === 'function' && !document.getElementById('screen-admin').classList.contains('hidden')) window.renderAdmin();
      if (typeof window.renderPresident === 'function' && !document.getElementById('screen-president').classList.contains('hidden')) window.renderPresident();
    }
  });

  async function syncToCloud() {
    try {
      const localData = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
      const localNotis = JSON.parse(localStorage.getItem(STORE_KEY + '_notis')) || [];
      await setDoc(doc(db, "database", "global_state"), { accounts: localData, notifications: localNotis });
      console.log("Данные успешно синхронизированы с облаком Firebase!");
    } catch (e) {
      console.error("Ошибка отправки данных:", e);
    }
  }

  window.syncToCloud = syncToCloud;
</script>
</head>
<body>
<div class="card">

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div id="screen-home">
    <h1>💰 Счета GoldCoin</h1>
    <p class="sub">Система Зарплат и Премий</p>
    <button class="btn" onclick="showScreen('admin-login')">🔐 Admin</button>
    <button class="btn red" onclick="showScreen('pres-login')">👑 Президент</button>
    <button class="btn green" onclick="showScreen('my-login')">👤 Мой счёт</button>
  </div>

  <!-- ВХОД АДМИНА -->
  <div id="screen-admin-login" class="hidden">
    <button class="back" onclick="showScreen('home')">← Назад</button>
    <h2>Вход для админа</h2>
    <input type="password" id="admin-pass" placeholder="Пароль админа">
    <button class="btn" onclick="adminLogin()">Войти</button>
    <div class="msg err" id="admin-msg"></div>
  </div>

  <!-- ПАНЕЛЬ АДМИНА -->
  <div id="screen-admin" class="hidden">
    <button class="back" onclick="showScreen('home')">← Выйти</button>
    <h2>Панель админа</h2>
    <h3 style="margin:14px 0 6px;font-size:14px;">Создать счёт</h3>
    <input id="new-nick" placeholder="Ник">
    <input id="new-pass" placeholder="Пароль">
    <button class="btn green" onclick="createAccount()">Создать счёт</button>
    <div class="msg" id="create-msg"></div>
    <h3 style="margin:14px 0 6px;font-size:14px;">Все счета</h3>
    <div id="admin-list"></div>
  </div>

  <!-- ВХОД ПРЕЗИДЕНТА -->
  <div id="screen-pres-login" class="hidden">
    <button class="back" onclick="showScreen('home')">← Назад</button>
    <h2>Вход для Президента</h2>
    <input type="password" id="pres-pass" placeholder="Код Президента">
    <button class="btn red" onclick="presLogin()">Управлять государством</button>
    <div class="msg err" id="pres-msg"></div>
  </div>

  <!-- ПАНЕЛЬ ПРЕЗИДЕНТА -->
  <div id="screen-president" class="hidden">
    <button class="back" onclick="showScreen('home')">← Выйти</button>
    <h2>👑 Панель Президента</h2>
    
    <h3 style="margin:14px 0 6px;font-size:14px;">🔔 Уведомления о премиях</h3>
    <div id="pres-notifications" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px;"></div>

    <h3 style="margin:14px 0 6px;font-size:14px;">Поиск, блокировка и зарплаты</h3>
    <input id="pres-search" placeholder="Введите ник для поиска..." oninput="renderPresident()">
    <div id="pres-list"></div>
  </div>

  <!-- ВХОД ПОЛЬЗОВАТЕЛЯ -->
  <div id="screen-my-login" class="hidden">
    <button class="back" onclick="showScreen('home')">← Назад</button>
    <h2>Мой счёт</h2>
    <input id="my-nick" placeholder="Ник">
    <input type="password" id="my-pass" placeholder="Пароль">
    <button class="btn green" onclick="myLogin()">Войти</button>
    <div class="msg err" id="my-msg"></div>
  </div>

  <!-- МОЙ СЧЁТ -->
  <div id="screen-my" class="hidden">
    <button class="back" onclick="myLogout()">← Выйти</button>
    <h2 id="my-title">Счёт</h2>
    <div class="balance-big" id="my-balance">0 GC</div>
    <p class="sub" id="my-salary-desc" style="margin-bottom:2px;">Заработок не настроен</p>
    <div class="msg" id="bonus-msg"></div>
    
    <button class="btn orange" onclick="requestBonus()" style="margin-bottom: 20px;">🎯 Потребовать премию</button>

    <h3 style="margin:14px 0 6px;font-size:14px;">Перевести</h3>
    <input id="tr-nick" placeholder="Ник получателя">
    <input id="tr-amount" type="number" min="0" step="0.01" placeholder="Сумма в goldcoin">
    <button class="btn" onclick="doTransfer()">Перевести</button>
    <div class="msg" id="tr-msg"></div>
  </div>

</div>
<script>
const ADMIN_PASSWORD = '666306227666';
const PRES_PASSWORD = '777'; 
const STORE_KEY = 'goldcoin_accounts_v2';
let currentNick = null;
let salaryInterval = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e) { return []; }
}

function save(accs) { 
  localStorage.setItem(STORE_KEY, JSON.stringify(accs)); 
  if (typeof window.syncToCloud === 'function') window.syncToCloud();
}

function loadNotis() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY + '_notis')) || []; }
  catch(e) { return []; }
}

function saveNotis(notis) {
  localStorage.setItem(STORE_KEY + '_notis', JSON.stringify(notis));
  if (typeof window.syncToCloud === 'function') window.syncToCloud();
}

function isAccountBlocked(acc) {
  if (!acc.blockedUntil) return false;
  return new Date().getTime() < acc.blockedUntil;
}

function getRemainingBlockedHours(acc) {
  if (!acc.blockedUntil) return 0;
  const diff = acc.blockedUntil - new Date().getTime();
  if (diff <= 0) return 0;
  return (diff / (1000 * 60 * 60)).toFixed(1);
}

// Запуск фонового начисления тикающей зарплаты каждую секунду
function startSalaryTicker() {
  if (salaryInterval) clearInterval(salaryInterval);
  salaryInterval = setInterval(() => {
    if (!currentNick) return;
    const accs = load();
    const acc = accs.find(a => a.nick.toLowerCase() === currentNick.toLowerCase());
    if (!acc || !acc.salary || acc.salary <= 0 || isAccountBlocked(acc)) return;

    const now = new Date().getTime();
    if (!acc.lastSalaryUpdate) acc.lastSalaryUpdate = now;
    
    const diffSeconds = (now - acc.lastSalaryUpdate) / 1000;
    if (diffSeconds <= 0) return;

    let periodSeconds = 1;
    if (acc.salaryPeriod === 'minute') periodSeconds = 60;
    if (acc.salaryPeriod === 'hour') periodSeconds = 3600;
    if (acc.salaryPeriod === 'day') periodSeconds = 86400;
    if (acc.salaryPeriod === 'week') periodSeconds = 604800;
    if (acc.salaryPeriod === 'year') periodSeconds = 31536000;

    const earned = (acc.salary / periodSeconds) * diffSeconds;
    acc.balance = parseFloat((acc.balance + earned).toFixed(5));
    acc.lastSalaryUpdate = now;

    localStorage.setItem(STORE_KEY, JSON.stringify(accs));
    
    const balEl = document.getElementById('my-balance');
    if (balEl) balEl.textContent = parseFloat(acc.balance.toFixed(2)) + ' GC';
  }, 1000);
}

function pushTickerToCloud() {
  const accs = load();
  save(accs);
}
function showScreen(name) {
  ['home','admin-login','admin','pres-login','president','my-login','my'].forEach(s => {
    const el = document.getElementById('screen-'+s);
    if(el) el.classList.toggle('hidden', s !== name);
  });
  if (name !== 'my' && salaryInterval) clearInterval(salaryInterval);
  
  if (name === 'admin') renderAdmin();
  if (name === 'president') renderPresident();
}

function adminLogin() {
  const p = document.getElementById('admin-pass').value;
  if (p === ADMIN_PASSWORD) showScreen('admin');
  else document.getElementById('admin-msg').textContent = 'Неверный пароль';
}

function presLogin() {
  const p = document.getElementById('pres-pass').value;
  if (p === PRES_PASSWORD) showScreen('president');
  else document.getElementById('pres-msg').textContent = 'Неверный код Президента';
}

function createAccount() {
  const nick = document.getElementById('new-nick').value.trim();
  const pass = document.getElementById('new-pass').value;
  const msg = document.getElementById('create-msg');
  if (!nick || !pass) { msg.textContent = 'Заполните ник и пароль'; msg.className='msg err'; return; }
  const accs = load();
  if (accs.some(a => a.nick.toLowerCase() === nick.toLowerCase())) {
    msg.textContent = 'Такой ник уже есть'; msg.className='msg err'; return;
  }
  accs.push({ nick, pass, balance: 0, blockedUntil: null, salary: 0, salaryPeriod: 'hour', lastSalaryUpdate: null });
  save(accs);
  document.getElementById('new-nick').value = '';
  document.getElementById('new-pass').value = '';
  msg.textContent = 'Счёт «' + nick + '» создан'; msg.className='msg ok';
  renderAdmin();
}

function myLogin() {
  const nick = document.getElementById('my-nick').value.trim();
  const pass = document.getElementById('my-pass').value;
  const msg = document.getElementById('my-msg');
  const accs = load();
  const acc = accs.find(a => a.nick.toLowerCase() === nick.toLowerCase() && a.pass === pass);
  
  if (acc) {
    if (isAccountBlocked(acc)) {
      msg.textContent = `Ваш счёт заблокирован Президентом! Осталось: ${getRemainingBlockedHours(acc)} ч.`;
      return;
    }
    currentNick = acc.nick;
    acc.lastSalaryUpdate = new Date().getTime();
    localStorage.setItem(STORE_KEY, JSON.stringify(accs));
    showScreen('my');
    updateCurrentScreen();
    startSalaryTicker();
  } else {
    msg.textContent = 'Неверный ник или пароль';
  }
}

function myLogout() {
  pushTickerToCloud();
  currentNick = null;
  if (salaryInterval) clearInterval(salaryInterval);
  showScreen('home');
}

function updateCurrentScreen() {
  if (!currentNick) return;
  const accs = load();
  const acc = accs.find(a => a.nick.toLowerCase() === currentNick.toLowerCase());
  if (acc) {
    if (isAccountBlocked(acc)) {
      alert(`Ваш счёт был заблокирован!`);
      myLogout();
      return;
    }
    document.getElementById('my-title').textContent = 'Счёт: ' + acc.nick;
    document.getElementById('my-balance').textContent = parseFloat(acc.balance.toFixed(2)) + ' GC';
    
    const desc = document.getElementById('my-salary-desc');
    if (acc.salary && acc.salary > 0) {
      const pText = { second:'секунду', minute:'минуту', hour:'час', day:'день', week:'неделю', year:'год' }[acc.salaryPeriod];
      desc.textContent = `Зарплата: ${acc.salary} GC каждую ${pText} (начисляется)`;
    } else {
      desc.textContent = 'Заработок не настроен';
    }
  }
}

function requestBonus() {
  const sum = parseFloat(prompt('Какую сумму премии вы хотите потребовать у Президента (в GC)?'));
  const msg = document.getElementById('bonus-msg');
  if (isNaN(sum) || sum <= 0) {
    msg.textContent = 'Введите корректную сумму!'; msg.className = 'msg err'; return;
  }
  pushTickerToCloud();
  
  const notis = loadNotis();
  notis.push({ id: new Date().getTime(), from: currentNick, amount: sum });
  saveNotis(notis);
  
  msg.textContent = `Запрос на премию в размере ${sum} GC отправлен Президентом!`;
  msg.className = 'msg ok';
}

function doTransfer() {
  pushTickerToCloud();
  const toNick = document.getElementById('tr-nick').value.trim();
  const amount = parseFloat(document.getElementById('tr-amount').value);
  const msg = document.getElementById('tr-msg');
  if (!toNick || isNaN(amount) || amount <= 0) { msg.textContent = 'Неверная сумма или ник'; msg.className='msg err'; return; }
  
  const accs = load();
  const fromAcc = accs.find(a => a.nick.toLowerCase() === currentNick.toLowerCase());
  const toAcc = accs.find(a => a.nick.toLowerCase() === toNick.toLowerCase());
  
  if (isAccountBlocked(fromAcc)) { msg.textContent = 'Ваш счёт заблокирован!'; msg.className='msg err'; return; }
  if (!toAcc) { msg.textContent = 'Получатель не найден'; msg.className='msg err'; return; }
  if (fromAcc.balance < amount) { msg.textContent = 'Недостаточно средств'; msg.className='msg err'; return; }
  
  fromAcc.balance = parseFloat((fromAcc.balance - amount).toFixed(2));
  toAcc.balance = parseFloat((toAcc.balance + amount).toFixed(2));
  
  save(accs);
  updateCurrentScreen();
  document.getElementById('tr-nick').value = '';
  document.getElementById('tr-amount').value = '';
  msg.textContent = 'Перевод выполнен!'; msg.className='msg ok';
}
function deleteAccount(nick) {
  if (!confirm('Удалить счёт ' + nick + '?')) return;
  let accs = load();
  accs = accs.filter(a => a.nick.toLowerCase() !== nick.toLowerCase());
  save(accs);
  renderAdmin();
}

function addMoney(idx) {
  const amountInput = document.getElementById(`input-${idx}`);
  const amount = parseFloat(amountInput.value);
  if (isNaN(amount) || amount <= 0) { alert('Введите корректную сумму больше 0'); return; }
  const accs = load();
  accs[idx].balance = parseFloat((accs[idx].balance + amount).toFixed(2));
  save(accs);
  renderAdmin();
}

function renderAdmin() {
  const accs = load();
  const list = document.getElementById('admin-list');
  if (!list) return;
  list.innerHTML = '';
  accs.forEach((a, idx) => {
    const div = document.createElement('div');
    div.className = 'acct';
    const blockedLabel = isAccountBlocked(a) ? ` <span class="badge-blocked">БАН (${getRemainingBlockedHours(a)}ч)</span>` : '';
    div.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="name">${a.nick}${blockedLabel}</span>
        <button class="del" onclick="deleteAccount('${a.nick}')">×</button>
      </div>
      <div class="bal">${parseFloat(a.balance.toFixed(2))} GC</div>
      <div class="pw" style="margin-bottom:8px;">Пароль: ${a.pass}</div>
      <div class="row">
        <input type="number" id="input-${idx}" step="0.01" placeholder="Сумма">
        <button class="btn small green" onclick="addMoney(${idx})">+ Начислить</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function renderPresident() {
  const accs = load();
  const notis = loadNotis();
  const list = document.getElementById('pres-list');
  const notiList = document.getElementById('pres-notifications');
  const query = document.getElementById('pres-search').value.toLowerCase().trim();
  
  if (notiList) {
    notiList.innerHTML = '';
    if (notis.length === 0) {
      notiList.innerHTML = '<p class="sub" style="margin:0; text-align:left;">Нет новых запросов</p>';
    }
    notis.forEach(n => {
      const div = document.createElement('div');
      div.className = 'noti-item';
      div.innerHTML = `
        <div style="font-size:14px; margin-bottom: 6px;"><b>${n.from}</b> требует премию <b>${n.amount} GC</b></div>
        <div style="display:flex; gap:8px;">
          <button class="btn small green" onclick="approveBonus(${n.id})">Одобрить</button>
          <button class="btn small red" onclick="rejectBonus(${n.id})">Отклонить</button>
        </div>
      `;
      notiList.appendChild(div);
    });
  }

  if (!list) return;
  list.innerHTML = '';
  accs.forEach((a, idx) => {
    if (query && !a.nick.toLowerCase().includes(query)) return;

    const div = document.createElement('div');
    div.className = 'acct';
    
    const blocked = isAccountBlocked(a);
    let blockStatusHtml = blocked ? 
      `<div class="msg err" style="margin:4px 0;">Заблокирован! Осталось: ${getRemainingBlockedHours(a)} ч.</div>
       <button class="btn small green" style="width:100%;margin-top:6px;" onclick="unblockAccount(${idx})">🔓 Разблокировать сейчас</button>` :
      `<div class="row">
         <input type="number" id="block-time-${idx}" min="1" placeholder="Срок (в часах)">
         <button class="btn small red" onclick="blockAccount(${idx})">⛔ Забанить</button>
       </div>`;

    const pText = a.salary ? { second:'сек', minute:'мин', hour:'час', day:'день', week:'нед', year:'год' }[a.salaryPeriod] : 'не настроена';
    const currentSalStr = a.salary ? `${a.salary} GC / ${pText}` : 'Нет';

    div.innerHTML = `
      <div class="name">👑 Пользователь: ${a.nick}</div>
      <div class="bal">Баланс: ${parseFloat(a.balance.toFixed(2))} GC</div>
      <div class="salary-info" style="margin-bottom:8px;">Текущая зарплата: <b>${currentSalStr}</b></div>
      
      <div class="row" style="margin-bottom:10px;">
        <input type="number" id="sal-amount-${idx}" step="0.01" placeholder="Размер з/п">
        <select id="sal-period-${idx}">
          <option value="second">Каждую секунду</option>
          <option value="minute">Каждую минуту</option>
          <option value="hour" selected>Каждый час</option>
          <option value="day">Каждый день</option>
          <option value="week">Каждую неделю</option>
          <option value="year">Каждый год</option>
        </select>
        <button class="btn small green" onclick="setSalary(${idx})">💰 Назначить</button>
      </div>
      ${blockStatusHtml}
    `;
    list.appendChild(div);
  });
}

function setSalary(idx) {
  const val = parseFloat(document.getElementById(`sal-amount-${idx}`).value);
  const period = document.getElementById(`sal-period-${idx}`).value;
  if (isNaN(val) || val < 0) { alert('Введите корректную сумму зарплаты'); return; }
  
  const accs = load();
  accs[idx].salary = val;
  accs[idx].salaryPeriod = period;
  accs[idx].lastSalaryUpdate = new Date().getTime();
  save(accs);
  renderPresident();
}

function approveBonus(notiId) {
  let notis = loadNotis();
  const noti = notis.find(n => n.id === notiId);
  if (!noti) return;

  const accs = load();
  const acc = accs.find(a => a.nick.toLowerCase() === noti.from.toLowerCase());
  if (acc) {
    acc.balance = parseFloat((acc.balance + noti.amount).toFixed(2));
    save(accs);
  }
  
  notis = notis.filter(n => n.id !== notiId);
  saveNotis(notis);
  renderPresident();
  alert('Премия успешно выдана!');
}

function rejectBonus(notiId) {
  let notis = loadNotis();
  notis = notis.filter(n => n.id !== notiId);
  saveNotis(notis);
  renderPresident();
  alert('Запрос на премию отклонён.');
}

function blockAccount(idx) {
  const hours = parseFloat(document.getElementById(`block-time-${idx}`).value);
  if (isNaN(hours) || hours <= 0) { alert('Введите количество часов блокировки'); return; }
  const accs = load();
  accs[idx].blockedUntil = new Date().getTime() + (hours * 60 * 60 * 1000);
  save(accs);
  renderPresident();
}

function unblockAccount(idx) {
  const accs = load();
  accs[idx].blockedUntil = null;
  save(accs);
  renderPresident();
}

window.renderAdmin = renderAdmin;
window.renderPresident = renderPresident;
window.addMoney = addMoney;
window.blockAccount = blockAccount;
window.unblockAccount = unblockAccount;
window.updateCurrentScreen = updateCurrentScreen;
window.setSalary = setSalary;
window.approveBonus = approveBonus;
window.rejectBonus = rejectBonus;
</script>
